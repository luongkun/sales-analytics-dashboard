# Render Blueprint — deploy miễn phí (plan: free)
# Cách dùng: dashboard.render.com → New → Blueprint → chọn repo này → Apply.
services:
  - type: web
    name: salessuite
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: DEPLOY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      # Task 80 — DB cloud Turso: credentials đã nằm trong server/.env (commit)
      # → Render boot tự đọc, KHÔNG cần set gì trong Dashboard.
      # Muốn override (vd rotate token): set LIBSQL_URL / LIBSQL_AUTH_TOKEN trong
      # Render Environment — process.env ưu tiên hơn .env.
      # ⚠️ Bảo mật: repo public + token rw — xem DEPLOY.md mục Turso.
      # - key: ZAI_API_KEY        # (tuỳ chọn) bật Chatbot AI Lumi — xem DEPLOY.md
      #   sync: false
